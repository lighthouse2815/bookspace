name: bookspace

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "5080"
      BOOKSPACE_ConnectionStrings__DefaultConnection: Data Source=/app/data/bookspace.db
      BOOKSPACE_DataProtection__KeysPath: /app/data/dataprotection-keys
      BOOKSPACE_Jwt__Issuer: BookSpace
      BOOKSPACE_Jwt__Audience: BookSpace.Web
      BOOKSPACE_Jwt__Secret: ${JWT_SECRET:-local-docker-secret-change-before-production-123456789}
      BOOKSPACE_Cors__AllowedOrigins__0: http://localhost:5173
      BOOKSPACE_BookstoreIntegration__Enabled: "false"
    ports:
      - "5080:5080"
    volumes:
      - bookspace-data:/app/data
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_OPERATOR_NAME: BookSpace Local
        VITE_SUPPORT_EMAIL: admin@bookspace.local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  bookspace-data:
